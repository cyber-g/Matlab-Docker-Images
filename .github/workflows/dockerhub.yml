name: Publish R2024a images to Docker Hub

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image revision (positive integer, for example 1 for v1)"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - context: base-comms-signalblocks
            variant: base-comms-signalblocks
          - context: deep-learning-comms-signalblocks
            variant: dl-comms-signalblocks
    env:
      IMAGE_VERSION: ${{ inputs.version }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
    steps:
      - name: Validate publication settings
        id: validate-publication-settings
        shell: bash
        run: |
          if [[ ! "$IMAGE_VERSION" =~ ^([1-9][0-9]*)(\.0+)?$ ]]; then
            echo "::error::Version must be a positive integer."
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          if [[ -z "$DOCKERHUB_REPOSITORY" ]]; then
            echo "::error::Set DOCKERHUB_REPOSITORY to your Docker Hub namespace/repository."
            exit 1
          fi

      - uses: actions/checkout@v4.2.2
      - uses: docker/setup-buildx-action@v3.11.1
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: ${{ env.DOCKERHUB_REPOSITORY }}:r2024a-${{ matrix.variant }}-v${{ steps.validate-publication-settings.outputs.version }}
